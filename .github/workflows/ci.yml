name: CI

on:
  push:
    branches: [master, main]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.config.ts'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vitest.config.ts'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Corepack & Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Setup Node.js ${{ matrix.node-version }} with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Check Pinned Dependencies
        run: pnpm run check:pinned-deps

      - name: Typecheck & Build Monorepo
        run: pnpm run build

      - name: Run Test Coverage & Thresholds
        run: pnpm run test:coverage
