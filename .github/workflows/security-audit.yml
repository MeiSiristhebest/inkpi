name: Dependency Security & Supply Chain Audit

on:
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/security-audit.yml'
  schedule:
    # 每周一凌晨 03:00 自动进行定期供应链漏洞巡检
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit Production Dependencies for Known Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Corepack & Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Setup Node.js 22.x with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Verify Exact Pinned Versions
        run: pnpm run check:pinned-deps

      - name: Run Vulnerability Audit
        run: |
          pnpm audit --prod --audit-level=high \
            --registry=https://registry.npmjs.org
