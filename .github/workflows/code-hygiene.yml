name: Code Hygiene & Early Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'biome.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/code-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sanity-check:
    name: Fast Static Check (Biome & Pinned Deps)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Corepack & Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Setup Node.js 22.x with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Pinned Dependencies
        run: pnpm run check:pinned-deps

      - name: Run Biome Lint & Format Check
        run: npx @biomejs/biome check packages/ tests/ scripts/

      - name: Fast TypeScript Typecheck
        run: pnpm run build
