name: Release & Publishing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-npm:
    name: Publish Packages to NPM (@inkpi/*)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Enable Corepack & Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Check Pinned Dependencies
        run: pnpm run check:pinned-deps

      - name: Typecheck & Build Monorepo
        run: pnpm run build

      - name: Run Test Coverage
        run: pnpm run test:coverage

      - name: Publish all public workspace packages to NPM
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-release:
    name: Build Multi-OS Standalone Binaries (${{ matrix.os }})
    needs: [publish-npm]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Enable Corepack & Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Typecheck & Build Monorepo
        run: pnpm run build

      - name: Build Standalone Executables
        run: node scripts/build-binaries.mjs

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inkpi-binaries-${{ matrix.os }}
          path: dist-bin/
