name: Evals & Provenance Contracts

on:
  push:
    branches: [master, main]
    paths:
      - "packages/evals/**"
      - "tests/**"
      - "docs/specs/AI_RUNTIME_SPEC_v1.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.config.ts"
      - ".github/workflows/evals.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "packages/evals/**"
      - "tests/**"
      - "docs/specs/AI_RUNTIME_SPEC_v1.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.config.ts"
      - ".github/workflows/evals.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: Deterministic Evals & Provenance Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Enable Corepack & Setup pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.15.5 --activate

      - name: Setup Node.js 22.x with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Deterministic Evals & Provenance Contracts
        run: pnpm run test:evals

      - name: Run Phase 23 local atomic gate and Phase 22 reliability matrix
        run: >-
          pnpm exec vitest run
          tests/phase23-local-freeze.test.ts
          tests/phase22-reliability-matrix.test.ts
          tests/semantic-content-boundaries.test.ts
          tests/domain-sync.test.ts
          tests/final-freeze-cross-boundary.test.ts
          tests/task-evals.test.ts
          tests/task-contract.test.ts
          tests/first-party-skill-activation.test.ts
          tests/proposal-sync.test.ts
          tests/runtime-phase9-13.test.ts
          tests/process-restart-e2e.test.ts
          tests/fault-injection-recovery.test.ts
          tests/context-cache-pipeline-integration.test.ts
          tests/context-overflow-reliability.test.ts
          tests/serialized-creative-context-provider.test.ts
          tests/skills-instructions.test.ts
          tests/artifact-rpc-e2e.test.ts
          tests/runtime-cache-cross-layer.test.ts
          tests/runtime-cache-persistence-restart.test.ts
          tests/provider-route-fallback.test.ts
          tests/provider-capability-matrix-gate.test.ts
          tests/daemon-rpc-e2e.test.ts
          tests/task-router-durable-boundary.test.ts
          tests/phase20-21-plugin-legacy-architecture.test.ts
          tests/task-provenance.test.ts
          tests/task-observability.test.ts

      - name: Run Phase 18 long-context benchmarks
        run: pnpm exec vitest run packages/evals/src/benchmarks/long-context.test.ts

      - name: Typecheck evals package
        run: pnpm --filter @inkpi/evals run build
